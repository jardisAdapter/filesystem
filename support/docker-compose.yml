services:
  phpcli:
    image: ${DOCKER_HUB:-headgent}/phpcli:${PHP_VERSION:-8.3}
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-0}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - APCU_SHM_SIZE=${APCU_SHM_SIZE:-64M}
      - OPCACHE_MEMORY_CONSUMPTION=${OPCACHE_MEMORY_CONSUMPTION:-128}
      - OPCACHE_MAX_ACCELERATED_FILES=${OPCACHE_MAX_ACCELERATED_FILES:-4000}
      - OPCACHE_REVALIDATE_FREQ=${OPCACHE_REVALIDATE_FREQ:-2}
      - PHP_ERROR_REPORTING=${PHP_ERROR_REPORTING:-"E_ALL & ~E_DEPRECATED & ~E_STRICT"}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-Off}
      - PHP_LOG_ERRORS=${PHP_LOG_ERRORS:-On}
      - XDEBUG_MODE=${XDEBUG_MODE:-debug}
      - XDEBUG_START_WITH_REQUEST=${XDEBUG_START_WITH_REQUEST:-yes}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - XDEBUG_LOG_LEVEL=${XDEBUG_LOG_LEVEL:-0}
      - S3_TEST_ENDPOINT=${S3_TEST_ENDPOINT:-http://filesystem-s3:9000}
      - S3_TEST_ACCESS_KEY=${S3_TEST_ACCESS_KEY:-s3testadmin}
      - S3_TEST_SECRET_KEY=${S3_TEST_SECRET_KEY:-s3testadmin}
      - S3_TEST_BUCKET=${S3_TEST_BUCKET:-testbucket}
      - S3_TEST_REGION=${S3_TEST_REGION:-us-east-1}
      - S3_TEST_ACL_SUPPORTED=${S3_TEST_ACL_SUPPORTED:-false}
    volumes:
      - ../:/app
    working_dir: /app
    depends_on:
      filesystem-s3:
        condition: service_healthy
    networks:
      - filesystem-network

  filesystem-s3:
    image: rustfs/rustfs:1.0.0
    container_name: filesystem-s3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_TEST_ACCESS_KEY:-s3testadmin}
      RUSTFS_SECRET_KEY: ${S3_TEST_SECRET_KEY:-s3testadmin}
      RUSTFS_CONSOLE_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - filesystem-network

networks:
  filesystem-network:
    driver: bridge
